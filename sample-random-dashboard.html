<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Data Explorer</title>
<script>
  (function(){
    var d=localStorage.getItem('theme'),
        m=d||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    if(m==='dark') document.documentElement.classList.add('dark');
  })();
</script>
<style>
  :root {
    --ivory: #FAF9F5;
    --slate: #141413;
    --clay: #D97757;
    --oat: #E3DACC;
    --olive: #788C5D;
    --rust: #B04A3F;
    --teal: #4A8C8C;
    --gray-100: #F0EEE6;
    --gray-300: #D1CFC5;
    --gray-500: #87867F;
    --gray-700: #3D3D3A;
    --white: #FFFFFF;

    --bg: var(--ivory);
    --fg: var(--slate);
    --card-bg: var(--white);
    --card-border: var(--gray-300);
    --muted: var(--gray-500);
    --bar-track: var(--gray-100);

    --serif: ui-serif, Georgia, serif;
    --sans: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;

    --radius: 12px;
    --radius-sm: 8px;
    --border: 1.5px solid var(--card-border);
  }

  html.dark {
    --bg: #1a1a19;
    --fg: #e8e6df;
    --card-bg: #242422;
    --card-border: #3d3d3a;
    --muted: #87867f;
    --bar-track: #2e2e2c;
    --gray-100: #2e2e2c;
    --gray-300: #3d3d3a;
    --oat: #3d3d3a;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    padding: 56px 24px 120px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 880px; margin: 0 auto; }

  /* Header */
  header { margin-bottom: 40px; }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 36px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: var(--border);
    background: var(--card-bg);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 16px;
    z-index: 100;
    transition: background 0.2s;
  }
  .theme-toggle:hover { background: var(--gray-100); }

  /* Regenerate button */
  .regen-btn {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--white);
    background: var(--clay);
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .regen-btn:hover { opacity: 0.85; }

  /* Stat cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
  }

  .stat-card {
    background: var(--card-bg);
    border: var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: transform 0.15s;
  }
  .stat-card:hover { transform: translateY(-2px); }

  .stat-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .stat-delta {
    font-family: var(--mono);
    font-size: 12px;
    margin-top: 4px;
  }
  .stat-delta.up { color: var(--olive); }
  .stat-delta.down { color: var(--rust); }

  /* Section */
  h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  section { margin-bottom: 36px; }

  /* Bar chart */
  .bar-chart {
    background: var(--card-bg);
    border: var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .bar-row:last-child { margin-bottom: 0; }

  .bar-label {
    font-family: var(--mono);
    font-size: 13px;
    width: 90px;
    flex-shrink: 0;
    text-align: right;
    color: var(--muted);
  }

  .bar-track {
    flex: 1;
    height: 28px;
    background: var(--bar-track);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-val {
    font-family: var(--mono);
    font-size: 12px;
    width: 50px;
    flex-shrink: 0;
    color: var(--muted);
  }

  /* Table */
  .table-wrap {
    background: var(--card-bg);
    border: var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-align: left;
    padding: 14px 16px;
    border-bottom: var(--border);
    font-weight: 500;
  }

  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--gray-100);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--gray-100); }

  .pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill-olive  { background: #e8f0dd; color: #4a6334; }
  .pill-clay   { background: #fce8de; color: #8b3d2a; }
  .pill-teal   { background: #ddf0f0; color: #2d6363; }
  .pill-rust   { background: #f8dbd7; color: #7a2e26; }

  html.dark .pill-olive  { background: #2d3a24; color: #a8c690; }
  html.dark .pill-clay   { background: #3d2a1e; color: #e8a080; }
  html.dark .pill-teal   { background: #1e3333; color: #7cc0c0; }
  html.dark .pill-rust   { background: #3a2220; color: #d09090; }

  .num-cell {
    font-family: var(--mono);
    font-size: 13px;
  }

  /* Sparkline */
  .sparkline {
    background: var(--card-bg);
    border: var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .sparkline svg {
    width: 100%;
    height: 120px;
  }

  .spark-line { fill: none; stroke: var(--clay); stroke-width: 2; }
  .spark-area { fill: var(--clay); opacity: 0.08; }
  .spark-dot  { fill: var(--clay); }

  @media (max-width: 600px) {
    body { padding: 40px 16px 80px; }
    h1 { font-size: 28px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .bar-label { width: 60px; font-size: 11px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <span id="theme-icon">◑</span>
</button>

<div class="page">
  <header>
    <div class="header-top">
      <h1>Random Data Explorer</h1>
      <button class="regen-btn" onclick="regenerate()">↻ Regenerate</button>
    </div>
    <div class="subtitle" id="seed-line">Seed: —</div>
  </header>

  <div class="stats" id="stats"></div>

  <section>
    <h2>Weekly Distribution</h2>
    <div class="bar-chart" id="bars"></div>
  </section>

  <section>
    <h2>Trend</h2>
    <div class="sparkline" id="sparkline"></div>
  </section>

  <section>
    <h2>Generated Records</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Score</th>
            <th>Delta</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
function toggleTheme() {
  var d = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', d ? 'dark' : 'light');
  document.getElementById('theme-icon').textContent = d ? '☀' : '◑';
}
(function(){
  document.getElementById('theme-icon').textContent =
    document.documentElement.classList.contains('dark') ? '☀' : '◑';
})();

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var rng;

function rand(lo, hi) { return Math.floor(rng() * (hi - lo + 1)) + lo; }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

var NAMES = [
  'Alder','Birch','Cedar','Dune','Echo','Fern','Glen','Hazel',
  'Iris','Jade','Kite','Lark','Moss','Nyx','Onyx','Pine',
  'Quinn','Reed','Sage','Thorn','Uma','Vale','Wren','Xia','Yew','Zephyr'
];

var CATEGORIES = [
  {label:'Active', cls:'pill-olive'},
  {label:'Pending', cls:'pill-clay'},
  {label:'Review', cls:'pill-teal'},
  {label:'Flagged', cls:'pill-rust'}
];

var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var COLORS = ['var(--clay)','var(--olive)','var(--teal)','var(--rust)'];

function regenerate() {
  var seed = Date.now() ^ (Math.random() * 0xFFFFFFFF >>> 0);
  rng = mulberry32(seed);
  document.getElementById('seed-line').textContent = 'Seed: ' + seed.toString(16).toUpperCase();

  // Stats
  var statsEl = document.getElementById('stats');
  var statDefs = [
    {label:'Total Items', range:[120,980]},
    {label:'Avg Score', range:[40,98], suffix:'%'},
    {label:'Throughput', range:[200,1500], suffix:'/h'},
    {label:'Anomalies', range:[0,24]}
  ];
  statsEl.innerHTML = statDefs.map(function(s) {
    var v = rand(s.range[0], s.range[1]);
    var d = rand(-15, 25);
    var sign = d >= 0 ? '+' : '';
    return '<div class="stat-card">' +
      '<div class="stat-label">' + s.label + '</div>' +
      '<div class="stat-value">' + v.toLocaleString() + (s.suffix || '') + '</div>' +
      '<div class="stat-delta ' + (d >= 0 ? 'up' : 'down') + '">' + sign + d + '% vs prior</div>' +
    '</div>';
  }).join('');

  // Bars
  var barsEl = document.getElementById('bars');
  var maxBar = 0;
  var barVals = DAYS.map(function() { var v = rand(20, 100); if (v > maxBar) maxBar = v; return v; });
  barsEl.innerHTML = DAYS.map(function(day, i) {
    var pct = (barVals[i] / maxBar * 100).toFixed(1);
    var color = COLORS[i % COLORS.length];
    return '<div class="bar-row">' +
      '<span class="bar-label">' + day + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<span class="bar-val">' + barVals[i] + '</span>' +
    '</div>';
  }).join('');

  // Sparkline
  var pts = [];
  for (var i = 0; i < 24; i++) pts.push(rand(10, 95));
  var svgW = 800, svgH = 120, pad = 4;
  var dx = (svgW - pad * 2) / (pts.length - 1);
  var coords = pts.map(function(v, j) {
    return [(pad + j * dx).toFixed(1), (svgH - pad - v * (svgH - pad * 2) / 100).toFixed(1)];
  });
  var line = coords.map(function(c) { return c[0] + ',' + c[1]; }).join(' ');
  var area = coords[0][0] + ',' + (svgH - pad) + ' ' + line + ' ' + coords[coords.length-1][0] + ',' + (svgH - pad);
  var dots = coords.map(function(c) {
    return '<circle class="spark-dot" cx="' + c[0] + '" cy="' + c[1] + '" r="3"/>';
  }).join('');
  document.getElementById('sparkline').innerHTML =
    '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" preserveAspectRatio="none">' +
      '<polygon class="spark-area" points="' + area + '"/>' +
      '<polyline class="spark-line" points="' + line + '"/>' +
      dots +
    '</svg>';

  // Table
  var tbody = document.getElementById('table-body');
  var used = {};
  var rows = [];
  for (var r = 0; r < 10; r++) {
    var name;
    do { name = pick(NAMES); } while (used[name]);
    used[name] = true;
    var cat = pick(CATEGORIES);
    var score = rand(12, 99);
    var delta = rand(-30, 40);
    var sign2 = delta >= 0 ? '+' : '';
    rows.push(
      '<tr>' +
        '<td>' + name + '</td>' +
        '<td><span class="pill ' + cat.cls + '">' + cat.label + '</span></td>' +
        '<td class="num-cell">' + score + '</td>' +
        '<td class="num-cell ' + (delta >= 0 ? 'stat-delta up' : 'stat-delta down') + '">' + sign2 + delta + '%</td>' +
      '</tr>'
    );
  }
  tbody.innerHTML = rows.join('');
}

regenerate();
</script>
</body>
</html>
